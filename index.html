/* ============================================================
   COMPATIBILITY ENGINE
   ============================================================ */
function checkCompatibility(build) {
  const issues = [];
  const { cpu, mobo, ram, gpu, psu } = build;
  if (cpu && mobo && cpu.socket !== mobo.socket) issues.push({ level: "error", text: cpu.name + " (" + cpu.socket + ") doesn't fit " + mobo.name + " (" + mobo.socket + ")." });
  if (ram && mobo && ram.mem !== mobo.mem) issues.push({ level: "error", text: ram.name + " is " + ram.mem + "; " + mobo.name + " needs " + mobo.mem + "." });
  if (psu && (cpu || gpu)) {
    const draw = (cpu?.tdp || 0) + (gpu?.power || 0) + 150;
    const headroom = psu.watts - draw;
    if (headroom < 0) issues.push({ level: "error", text: "Estimated draw (~" + draw + "W) exceeds the " + psu.watts + "W supply." });
    else if (headroom < 150) issues.push({ level: "warn", text: "Power headroom is tight (~" + headroom + "W spare). Consider a larger supply." });
  }
  return issues;
}

   ============================================================ */
function BuilderPage() {
  const [selected, setSelected] = useState({});
  const [active, setActive] = useState("cpu");

  const build = useMemo(() => {
    const b = {};
    for (const k of Object.keys(selected)) { const item = CATALOG[k]?.find((x) => x.id === selected[k]); if (item) b[k] = item; }
    return b;
  }, [selected]);

  const subtotal = useMemo(() => Object.values(build).reduce((s, x) => s + x.price, 0), [build]);
  const total = subtotal > 0 ? subtotal + ASSEMBLY_FEE : 0;
  const issues = useMemo(() => checkCompatibility(build), [build]);
  const errorCount = issues.filter((i) => i.level === "error").length;
  const chosenCount = CATEGORY_META.filter((c) => build[c.key]).length;
  const progress = Math.round((chosenCount / CATEGORY_META.length) * 100);
  const select = useCallback((cat, id) => setSelected((s) => ({ ...s, [cat]: s[cat] === id ? undefined : id })), []);

  return (
    <React.Fragment>
      <div className="tz-hero">
        <div className="tz-hero-eyebrow">CUSTOM BUILD · NEW PARTS ONLY</div>
        <h1 className="tz-hero-title">Design it. We'll build it.</h1>
        <p className="tz-hero-sub">Pick every part, watch it come together in 3D, and choose your lighting. We assemble, stress-test, and ship it to your door.</p>
      </div>
      <div className="tz-main">
        <section className="tz-catalog">
          <div className="tz-cat-tabs">
            {CATEGORY_META.map((c) => (
              <button key={c.key} className={"tz-tab " + (active === c.key ? "tz-tab-on " : "") + (build[c.key] ? "tz-tab-filled" : "")} onClick={() => setActive(c.key)}>
                <span className="tz-tab-label">{c.label}</span>{build[c.key] && <span className="tz-tab-check">✓</span>}
              </button>
            ))}
          </div>
          <div className="tz-parts">
            {CATALOG[active].map((part) => {
              const on = selected[active] === part.id;
              return (
                <button key={part.id} className={"tz-part " + (on ? "tz-part-on" : "")} onClick={() => select(active, part.id)}>
                  <div className="tz-part-thumb"><PartImage part={part} size="thumb" /></div>
                  <div className="tz-part-info">
                    <div className="tz-part-top"><span className="tz-part-brand">{part.brand}</span>{part.tag && <span className="tz-part-tag">{part.tag}</span>}</div>
                    <div className="tz-part-name">{part.name}</div>
                    <div className="tz-part-bottom"><span className="tz-part-price">{fmt(part.price)}</span><span className={"tz-part-pick " + (on ? "tz-part-pick-on" : "")}>{on ? "Selected" : "Select"}</span></div>
                  </div>
                </button>
              );
            })}
          </div>
        </section>

        <section className="tz-stage">
          <div className="tz-stage-head">
            <span>Your build</span>
            <span className="tz-stage-count">{chosenCount}/{CATEGORY_META.length} parts</span>
          </div>
          <div className="tz-build-grid">
            {CATEGORY_META.map((c) => (
              <button key={c.key} className={"tz-bg-cell " + (active === c.key ? "tz-bg-active " : "") + (build[c.key] ? "tz-bg-filled" : "")} onClick={() => setActive(c.key)}>
                <div className="tz-bg-imgwrap"><PartImage part={build[c.key]} size="grid" /></div>
                <span className="tz-bg-cat">{c.label}</span>
                <span className="tz-bg-name">{build[c.key] ? build[c.key].name : "Choose"}</span>
              </button>
            ))}
          </div>
        </section>

        <aside className="tz-summary">
          <div className="tz-progress">
            <div className="tz-progress-row"><span>Build progress</span><span className="tz-progress-pct">{progress}%</span></div>
            <div className="tz-progress-bar"><div className="tz-progress-fill" style={{ width: progress + "%" }} /></div>
          </div>
          <div className="tz-sum-list">
            {CATEGORY_META.map((c) => (
              <div key={c.key} className={"tz-sum-row " + (build[c.key] ? "" : "tz-sum-empty")} onClick={() => setActive(c.key)}>
                <span className="tz-sum-cat">{c.label}</span>
                <span className="tz-sum-val">{build[c.key] ? build[c.key].name : "Not selected"}</span>
                <span className="tz-sum-price">{build[c.key] ? fmt(build[c.key].price) : "—"}</span>
              </div>
            ))}
          </div>
          {issues.length > 0 && (
            <div className="tz-issues">
              {issues.map((i, n) => (<div key={n} className={"tz-issue tz-issue-" + i.level}><span className="tz-issue-dot" />{i.text}</div>))}
            </div>
          )}
          <div className="tz-totals">
            <div className="tz-total-row"><span>Parts subtotal</span><span>{fmt(subtotal)}</span></div>
            <div className="tz-total-row tz-total-fee"><span>Assembly, cable management &amp; 48-hr stress test</span><span>{subtotal > 0 ? fmt(ASSEMBLY_FEE) : "—"}</span></div>
            <div className="tz-total-row tz-total-grand"><span>Total</span><span>{fmt(total)}</span></div>
          </div>
          <button className="tz-checkout" disabled={chosenCount < CATEGORY_META.length || errorCount > 0}>
            {errorCount > 0 ? "Resolve " + errorCount + " issue" + (errorCount > 1 ? "s" : "") : chosenCount < CATEGORY_META.length ? "Pick " + (CATEGORY_META.length - chosenCount) + " more part" + (CATEGORY_META.length - chosenCount > 1 ? "s" : "") : "Request this build"}
          </button>
          <p className="tz-checkout-note">Free 3-year labor warranty · Ships in 5–7 business days</p>
        </aside>
      </div>
    </React.Fragment>
  );
}

}

.tz-tier-name{font-family:'Chakra Petch'; font-weight:700; font-size:24px; margin:0 0 4px; letter-spacing:.5px;}
.tz-tier-lead{font-family:'Chakra Petch'; font-size:11px; letter-spacing:1px; text-transform:uppercase; color:var(--cyan); margin-bottom:14px;}
.tz-tier-body{color:var(--muted); font-size:13px; line-height:1.65; margin:0 0 16px;}
.tz-tier-points{list-style:none; padding:0; margin:auto 0 0; display:flex; flex-direction:column; gap:8px;}
.tz-tier-points li{font-size:12.5px; color:var(--text); padding-left:18px; position:relative;}
.tz-tier-points li:before{content:"▹"; position:absolute; left:0; color:var(--cyan);}

.tz-inquiry{max-width:780px; margin:0 auto; border:1px solid var(--line); border-radius:16px; padding:28px; background:var(--panel);}
.tz-inquiry-head{text-align:center; margin-bottom:20px;}
.tz-inquiry-title{font-family:'Chakra Petch'; font-weight:700; font-size:22px; margin:0 0 6px;}
.tz-inquiry-sub{color:var(--muted); font-size:13px; line-height:1.6; margin:0; max-width:480px; margin:0 auto;}
.tz-inquiry-grid{display:grid; grid-template-columns:1fr 1fr; gap:12px;}
.tz-inq-full{grid-column:1 / -1;}
select.tz-input{appearance:none; cursor:pointer;}
.tz-inquiry-actions{display:flex; gap:14px; align-items:center; justify-content:center; margin-top:18px; flex-wrap:wrap;}
.tz-call-btn{font-family:'Chakra Petch'; font-weight:600; font-size:14px; letter-spacing:.5px; color:var(--text); text-decoration:none; border:1px solid var(--line); border-radius:9px; padding:13px 22px; transition:.15s;}
.tz-call-btn:hover{border-color:var(--cyan); color:var(--cyan);}
.tz-showcase{padding:54px 28px; border-bottom:1px solid var(--line);}
.tz-showcase-grid{display:grid; grid-template-columns:repeat(3,1fr); gap:18px;}
.tz-show-card{border:1px solid var(--line); border-radius:14px; overflow:hidden; background:var(--panel); transition:.15s;}
.tz-show-card:hover{border-color:#33414f; transform:translateY(-3px);}
.tz-show-viz{height:230px; background:radial-gradient(circle at 50% 45%, #151c26, #0b0e13 72%); border-bottom:1px solid var(--line);}
.tz-show-photo{width:100%; height:100%; object-fit:cover; display:block;}
.tz-show-ph{width:100%; height:100%; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:8px; text-align:center; padding:16px;}
.tz-show-ph-mark{color:var(--cyan); font-size:30px; opacity:.5;}
.tz-show-ph-text{font-family:'Chakra Petch'; font-size:13px; letter-spacing:.5px; color:var(--text);}
.tz-show-ph-sub{font-size:11px; color:var(--muted);}
.tz-show-body{padding:18px;}
.tz-show-top{display:flex; justify-content:space-between; align-items:baseline; margin-bottom:8px;}
.tz-show-name{font-family:'Chakra Petch'; font-weight:700; font-size:20px; margin:0; letter-spacing:.5px;}
.tz-show-price{font-family:'Chakra Petch'; font-size:13px; color:var(--cyan); font-weight:600;}
.tz-show-blurb{color:var(--muted); font-size:13px; line-height:1.55; margin:0 0 14px;}
.tz-show-specs{list-style:none; padding:0; margin:0; display:flex; flex-direction:column; gap:6px;}
.tz-show-specs li{font-size:12.5px; color:var(--text); padding-left:16px; position:relative;}
.tz-show-specs li:before{content:"▹"; position:absolute; left:0; color:var(--cyan);}
.tz-closing{padding:64px 28px; text-align:center; border-bottom:1px solid var(--line);}
.tz-closing-title{font-family:'Chakra Petch'; font-weight:700; font-size:36px; margin:0 0 10px; letter-spacing:-.5px;}
.tz-closing-sub{color:var(--muted); font-size:15px; margin:0 0 26px;}
.tz-contact{padding:60px 28px;}
.tz-contact-intro{color:var(--muted); font-size:14px; line-height:1.6; max-width:480px; margin:12px auto 0;}
.tz-contact-grid{display:grid; grid-template-columns:1fr 1.3fr; gap:24px; max-width:880px; margin:34px auto 0;}
.tz-contact-info{border:1px solid var(--line); border-radius:12px; padding:24px; background:var(--panel); display:flex; flex-direction:column; gap:16px;}
.tz-ci-row{display:flex; flex-direction:column; gap:3px;}
.tz-ci-label{font-family:'Chakra Petch'; font-size:10px; letter-spacing:1.5px; text-transform:uppercase; color:var(--muted);}
.tz-ci-val{font-size:14px; color:var(--text); text-decoration:none;}
a.tz-ci-val:hover{color:var(--cyan);}
.tz-contact-form{border:1px solid var(--line); border-radius:12px; padding:24px; background:var(--panel); display:flex; flex-direction:column; gap:12px;}
.tz-input{ background:var(--ink); border:1px solid var(--line); border-radius:8px; padding:12px 14px; color:var(--text); font-family:'Inter',sans-serif; font-size:14px; outline:none; transition:.15s; }
.tz-input:focus{border-color:var(--cyan);}
.tz-textarea{min-height:110px; resize:vertical;}
.tz-form-note{font-size:11px; color:var(--muted); text-align:center; margin:0;}
.tz-footer{display:flex; justify-content:space-between; align-items:center; padding:26px 28px; border-top:1px solid var(--line);}
.tz-footer-meta{font-size:12px; color:var(--muted); font-family:'Chakra Petch'; letter-spacing:.5px;}
@media (max-width:1080px){
  .tz-main{grid-template-columns:1fr;}
  .tz-build-grid{grid-template-columns:repeat(3,1fr);}
  .tz-home-hero{grid-template-columns:1fr;}
  .tz-home-hero-viz{height:340px;}
  .tz-process-grid{grid-template-columns:repeat(2,1fr);}
  .tz-showcase-grid{grid-template-columns:1fr;}
  .tz-pb-grid{grid-template-columns:1fr;}
  .tz-pb-head{flex-direction:column; align-items:flex-start; gap:10px;}
  .tz-tiers{grid-template-columns:1fr;}
  .tz-contact-grid{grid-template-columns:1fr;}
}
@media (max-width:560px){
  .tz-hero-title{font-size:28px;}
  .tz-home-title{font-size:38px;}
  .tz-header{gap:16px; padding:14px 16px;}
  .tz-nav{display:none;}
  .tz-home-stats{gap:24px;}
  .tz-process-grid{grid-template-columns:1fr;}
  .tz-inquiry-grid{grid-template-columns:1fr;}
}
`;

ReactDOM.createRoot(document.getElementById("root")).render(<TechZoneApp />);
</script>
</body>
</html>
